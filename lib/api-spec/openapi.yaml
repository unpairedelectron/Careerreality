      required: [id, title, company, location, remoteType, source, sourceName, provenance, canonicalUrl, applyUrl, publishedAt, lastVerifiedAt, matchScore, matchReason, matchEvidence, unknowns, applicationGuidance]
    JobRecommendationProvenance:

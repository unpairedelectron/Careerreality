name: CareerReality sitemap drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sitemap-drift:
    name: Compare live route sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release route set
        uses: actions/checkout@v4

      - name: Check live sitemap and route contracts
        id: sitemap-drift
        run: |
          set -o pipefail
          node artifacts/career-reality/scripts/verify-indexed-routes.mjs 2>&1 | tee sitemap-drift-report.json
        env:
          SEO_PRODUCTION_ORIGIN: https://careerreality.in
          SEO_ALTERNATE_ORIGINS: https://www.careerreality.in,https://indigo-bowed-megabyte.replit.app

      - name: Notify the team about sitemap drift
        if: failure()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: sitemap-drift-report.json
        with:
          script: |
            const fs = require("node:fs");
            const title = "CareerReality sitemap drift monitor is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rawReport = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, "utf8")
              : "";
            let report;
            try {
              report = JSON.parse(rawReport);
            } catch {
              report = null;
            }
            const failures = (report?.origins ?? []).flatMap((host) =>
              (host.failures ?? []).map((failure) =>
                `${host.origin} — ${failure.route}: ${failure.issue}${failure.detail ? ` (${failure.detail})` : ""}`,
              ),
            );
            const details = failures.length
              ? failures.slice(0, 40).map((failure) => `- ${failure}`).join("\n")
              : "The monitor did not produce a parseable failure report.";
            const body = [
              "The scheduled CareerReality sitemap monitor found a production route or metadata drift.",
              "",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              "",
              "Failures:",
              details,
              "",
              "The next successful monitor run will close this alert.",
            ].join("\n");
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated sitemap drift alert #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.notice(`Created sitemap drift alert #${created.data.number}.`);
            }

      - name: Resolve a previous sitemap drift alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CareerReality sitemap drift monitor is failing";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              const resolvedNote = `\n\nResolved by successful monitor run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                body: `${existing.body ?? ""}${resolvedNote}`,
              });
              core.notice(`Closed resolved sitemap drift alert #${existing.number}.`);
            }